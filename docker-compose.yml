# Manic AI Orchestrator — Docker Compose
# For local development or VPS deployment

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: manic_ai
      POSTGRES_USER: sonic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonic_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonic"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  # Redis for Celery
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  # Web service (FastAPI)
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sonic:${POSTGRES_PASSWORD:-sonic_password}@postgres:5432/manic_ai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access host network (for local LLM)

  # Background worker (Celery)
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql://sonic:${POSTGRES_PASSWORD:-sonic_password}@postgres:5432/manic_ai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access host network (for local LLM)

volumes:
  pgdata:
