# Manic AI Orchestrator — Render Blueprint
# Deploy this project to Render with one click
# 
# DATABASE: Set DATABASE_URL in Render dashboard
# - For NeonDB (recommended free tier): postgresql://user:pass@host/dbname?sslmode=require
# - For SQLite (local dev only): sqlite:///./manic_ai.db

services:
  # Web service (FastAPI) - Single process handles API + background tasks
  - type: web
    name: manic-ai-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false  # REQUIRED: Set this in Render dashboard
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        sync: false  # REQUIRED: Set your NeonDB connection string in Render dashboard
      - key: API_KEY
        sync: false  # Optional: Set this in Render dashboard (or leave empty for no auth)
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
