# Sonic AI Orchestrator — Render Blueprint
# Deploy this project to Render with one click

services:
  # Web service (FastAPI)
  - type: web
    name: sonic-ai-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: sonic-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sonic-ai-redis
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false  # Set this in Render dashboard
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: API_KEY
        sync: false  # Set this in Render dashboard (or leave empty for no auth)
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

  # Background worker (Celery)
  - type: worker
    name: sonic-ai-worker
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: sonic-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sonic-ai-redis
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false  # Set this in Render dashboard
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true

  # Redis for Celery
  - type: redis
    name: sonic-ai-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # PostgreSQL database
  - name: sonic-ai-db
    region: oregon
    plan: free
    databaseName: sonic_ai
    user: sonic_ai
